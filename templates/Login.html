<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 100%; max-width: 360px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .3rem; font-size: .9rem; }
    select, input { width: 100%; padding: .6rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; margin-top: 1.5rem; padding: .7rem; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { background: #fee2e2; color: #991b1b; padding: .6rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Iniciar sesión</h1>

    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}<div class="error">{{ m }}</div>{% endfor %}
    {% endwith %}

    <label for="tipo_documento">Tipo de documento</label>
    <select id="tipo_documento" name="tipo_documento" required>
      <option value="" disabled selected>Selecciona una opción</option>
      {% for t in tipos_documento %}
        <option value="{{ t.id }}">{{ t.nombre }}</option>
      {% endfor %}
    </select>

    <label for="numero_documento">Número de documento</label>
    <input id="numero_documento" name="numero_documento" type="text" inputmode="numeric" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required>

    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
